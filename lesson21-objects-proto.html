    //  Защита объектов

    Object.preventExtensions() // запрещает добавление новых свойств объекта, но в то же время оставляет существующие свойства нетронутыми.


    Object.seal() // запечатывает переданный ему объект, одновременно запрещая добавление новых свойств и конфигурирование существующих свойств, значения свойств при этом изменять можно. Другими словами Object.seal() является эквивалентом применения Object.preventExtensions() к объекту и configurable:false к его свойствам.

    Object.freeze() //замораживает объект, одновременно запрещая добавление новых свойств и изменение существующих свойств. Что соответствует применению Object.preventExtensions() к объекту и writable:false к его свойствам.
